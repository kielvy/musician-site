<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Baksey — Official</title>
  <meta name="description" content="Official site of Baksey — new sounds await.">
  <link rel="icon" href="/assets/mark.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/assets/mark.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="canonical" href="https://www.baksey.me/" />

  <meta property="og:description" content="Official site of Baksey — new sounds await.">

  <meta property="og:url" content="https://www.baksey.me/">
  <meta property="og:image" content="https://www.baksey.me/assets/home-preview.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Baksey — Official">
  <meta name="twitter:description" content="Official site of Baksey — new sounds await.">
  <meta name="twitter:image" content="https://www.baksey.me/assets/home-preview.jpg">
  <style>

    :root{
      --bg:#0b0c0f;
      --fg:#e9eaec;
      --muted:#9aa3ad;
      --bd:rgba(255,255,255,.14);
      --glass:rgba(18,20,26,.58);
      --shadow:0 22px 60px rgba(0,0,0,.55);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;font-family:'JetBrains Mono',monospace;background:var(--bg);color:var(--fg);overflow:hidden}

    /* Loader (soft pulse mark, no circles) */
    #loader{position:fixed;inset:0;display:grid;place-items:center;background:#0b0c0f;z-index:9999;transition:opacity .4s ease, visibility .4s ease}
    #loader.hide{opacity:0;visibility:hidden}
    .markpulse{width:92px;height:92px;display:grid;place-items:center}
    .markpulse img{width:80px;opacity:.85;animation:pulse 1.2s ease-in-out infinite}
    @keyframes pulse{0%,100%{transform:scale(.9);opacity:.6}50%{transform:scale(1);opacity:1}}

    /* Header */
    header{position:fixed;top:0;left:0;width:100%;padding:20px 28px;display:flex;align-items:center;justify-content:space-between;z-index:30}
    .brand{display:inline-flex;align-items:center;gap:10px;text-decoration:none}
    .brand img{height:22px;opacity:.96}
    .nav{display:flex;gap:24px}
    .nav a{color:var(--fg);text-decoration:none;opacity:.92;cursor:pointer}
    .nav a:hover{opacity:1}

    /* Pages */
    .page{position:fixed;inset:0;padding:96px 22px 26px;display:none;overflow:auto}
    .page.show{display:block}
    .wrap{max-width:1100px;margin:0 auto}

    /* Home (darkened bg only) */
    #home::before{content:"";position:absolute;inset:0;
      background:url('assets/backgroundhome.jpg') center/cover no-repeat;
      filter:brightness(.45) contrast(1.05) saturate(1.05);
      transform:scale(1.02);}
    .centerMark{position:absolute;inset:0;display:grid;place-items:center}
    .centerMark img{width:min(28vmin,200px);opacity:.92;animation:markpop .9s ease both .2s}
    @keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}

    /* Music grid */
    .grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
    .card{background:var(--glass);border:1px solid var(--bd);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:transform .2s ease}
    .card:hover{transform:translateY(-2px)}
    .cover{position:relative;aspect-ratio:1/1;background:#111}
    .cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .meta{padding:12px}
    .meta h3{margin:0 0 6px;font-size:16px}
    .muted{color:var(--muted);font-size:12px}

    /* Socials */
    .rows{display:flex;flex-direction:column;gap:12px}
    .row{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border:1px solid var(--bd);border-radius:10px;background:rgba(255,255,255,.06);text-decoration:none;color:var(--fg)}
    .row:hover{background:rgba(255,255,255,.1)}
    .row span{font-size:12px;color:var(--muted)}

    /* Smartlink */
    #smartBg{position:fixed;inset:0;z-index:0;filter:blur(20px) brightness(.42);transform:scale(1.06);background:#000 center/cover no-repeat}
    #socialBg{position:fixed;inset:0;z-index:0;filter:blur(20px) brightness(.42);transform:scale(1.06);background:#000 center/cover no-repeat}
    .smart-wrap{position:relative;z-index:1}
    .smart{display:grid;gap:26px;grid-template-columns:1.1fr .9fr;align-items:center}
    .smart .art{aspect-ratio:1/1;border-radius:12px;overflow:hidden;border:1px solid var(--bd);background:#111;box-shadow:var(--shadow)}
    .smart .art img{width:100%;height:100%;object-fit:cover}
    .smart .title{font-size:12px;letter-spacing:.1em;color:var(--muted);margin:0 0 10px}
    .smart .links{display:flex;flex-direction:column;gap:12px}
    .smart .link{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border:1px solid var(--bd);border-radius:10px;text-decoration:none;color:var(--fg);background:rgba(255,255,255,.06)}
    .smart .link:hover{background:rgba(255,255,255,.1)}
    @media (max-width: 900px){ .smart{grid-template-columns:1fr} }

    .titlebar{font-size:12px;letter-spacing:.12em;color:var(--muted);margin:0 0 16px 2px}
  
#home{overflow:hidden}

/* Latest Release widget on Home */
#latestRelease{
  position:absolute;left:28px;bottom:28px;z-index:2;
  display:flex;align-items:center;gap:14px;
  padding:12px 14px;border:1px solid var(--bd);border-radius:14px;
  background:var(--glass);box-shadow:var(--shadow);
  backdrop-filter:saturate(1.2) blur(6px);
}
#latestRelease .thumb{width:66px;height:66px;border-radius:10px;overflow:hidden;border:1px solid var(--bd);flex:none;background:#111}
#latestRelease .thumb img{width:100%;height:100%;object-fit:cover}
#latestRelease .info{display:flex;flex-direction:column;gap:6px;min-width:160px}
#latestRelease .label{font-size:10px;letter-spacing:.12em;color:var(--muted)}
#latestRelease .title{font-size:14px;line-height:1.15}
#latestRelease .cta{margin-left:auto;text-decoration:none;border:1px solid var(--bd);padding:8px 10px;border-radius:10px}
#latestRelease .cta:hover{background:rgba(255,255,255,.08)}
@media (max-width:640px){
  #latestRelease{left:16px;right:16px;bottom:16px;gap:12px}
  #latestRelease .info{min-width:0}
  #latestRelease .title{font-size:13px}
}


/* --- LATEST RELEASE: polished widget --- */
#latestRelease,
#latestRelease:link,
#latestRelease:visited{
  text-decoration:none;
  color:var(--fg);
}
#latestRelease{
  position:absolute;left:32px;bottom:32px;z-index:2;
  display:flex;align-items:center;gap:16px;
  padding:16px 18px;border:1px solid var(--bd);border-radius:16px;
  background:linear-gradient(180deg, rgba(18,20,26,.72), rgba(18,20,26,.58));
  box-shadow:var(--shadow);
  backdrop-filter:saturate(1.15) blur(8px);
  transition:transform .18s ease, background .18s ease, border-color .18s ease;
}
#latestRelease:hover{
  transform:translateY(-1px);
  background:linear-gradient(180deg, rgba(18,20,26,.78), rgba(18,20,26,.62));
  border-color:rgba(255,255,255,.20);
}
#latestRelease .thumb{width:84px;height:84px;border-radius:12px;overflow:hidden;border:1px solid var(--bd);flex:none;background:#111}
#latestRelease .thumb img{width:100%;height:100%;object-fit:cover}
#latestRelease .info{display:flex;flex-direction:column;gap:6px;min-width:200px}
#latestRelease .label{font-size:10px;letter-spacing:.14em;color:var(--muted)}
#latestRelease .title{font-size:16px;line-height:1.15}
#latestRelease .cta{
  margin-left:auto;border:1px solid var(--bd);padding:10px 12px;border-radius:12px;
  font-size:12px;letter-spacing:.06em;background:rgba(255,255,255,.06);
}
#latestRelease .cta:hover{background:rgba(255,255,255,.1)}
@media (max-width:640px){
  #latestRelease{left:16px;right:16px;bottom:16px;gap:14px;padding:14px 16px;border-radius:14px}
  #latestRelease .thumb{width:72px;height:72px}
  #latestRelease .info{min-width:0}
  #latestRelease .title{font-size:15px}
}


  </style>

<div id="loader" aria-hidden="true"><div class="markpulse"><img src="/assets/mark.svg" alt=""></div></div>
<script>
  window.addEventListener('load', ()=>{
    const l=document.getElementById('loader');
    if(l) setTimeout(()=>l.classList.add('hide'), 250);
  });
</script>

<body>
<header>
  <a href="/" class="brand" aria-label="Baksey home"><img src="/assets/baksey-logo.svg" alt="Baksey"></a>
  <nav class="nav"><a href="/music/">MUSIC</a><a href="/socials/">SOCIALS</a></nav>
</header>

<section id="home" class="page show" aria-label="Home" style="display:block;position:fixed;inset:0;padding:96px 22px 26px;overflow:hidden">
  <div class="centerMark"><img src="/assets/mark.svg" alt="Baksey Mark"></div>
  <a id="latestRelease" href="/rain/" aria-label="Open latest release">
    <div class="thumb"><img src="/assets/rain-cover.jpg" alt="BAKSEY — RAIN cover"></div>
    <div class="info">
      <div class="label">LATEST&nbsp;RELEASE</div>
      <div class="title">BAKSEY — RAIN</div>
    </div>
    <span class="cta">OPEN</span>
  </a>
</section>
<style>
/* Ensure background is set like SPA */
#home::before{content:"";position:absolute;inset:0;background:url('/assets/backgroundhome.jpg') center/cover no-repeat;filter:brightness(.45) contrast(1.05) saturate(1.05);transform:scale(1.02);}
</style>

</body></html>
