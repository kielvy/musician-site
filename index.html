<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Baksey</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;800&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background-color: #0a0a0a;
      font-family: 'JetBrains Mono', monospace;
      color: white;
      overflow-x: hidden;
    }

    .main-title {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'JetBrains Mono', monospace;
      font-weight: 800;
      font-size: 128px;
      color: rgba(255, 255, 255, 0.8);
      mix-blend-mode: difference;
      pointer-events: none;
      z-index: 1001;
      text-shadow: 0 0 10px rgba(0,0,0,0.2);
      white-space: nowrap; /* Ensures the title stays on one line */
    }

    .container {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cover, .socials-button {
      cursor: pointer;
      width: 300px;
      transition: transform 0.3s ease;
    }

    .cover:hover, .socials-button:hover {
      transform: scale(1.05);
      filter: brightness(0.8);
    }

    .overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background-color: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.2s ease, visibility 0.2s ease;
      display: flex;
      flex-direction: row; /* Default for desktop */
    }

    .overlay.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .overlay .left, .overlay .right {
      width: 50%; /* Default for desktop */
      height: 100%; /* Default for desktop */
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s ease-in-out;
    }
    
    .overlay .left.fading, .overlay .right.fading {
        opacity: 0;
    }

    .overlay .left img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .overlay .right {
      box-sizing: border-box; 
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding-left: 18%;
      padding-right: 40px;
      font-size: 12px;
      gap: 15vh;
    }

    .text-block {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
    }

    .overlay a {
      text-decoration: none;
      color: white;
      transition: filter 0.3s ease;
    }

    .overlay a:hover {
      filter: brightness(0.7);
    }

    .close-btn {
      position: fixed;
      top: 20px;
      right: 30px;
      font-size: 24px;
      cursor: pointer;
      transition: filter 0.3s ease;
      z-index: 10;
    }

    .close-btn:hover {
      filter: brightness(0.6);
    }

    .top-left {
      position: fixed;
      top: 20px;
      left: 30px;
      cursor: pointer;
      font-size: 12px;
      z-index: 10;
    }

    .top-left:hover {
      filter: brightness(0.8);
    }

    /* Mobile adaptations */
    @media (max-width: 768px) {
      .main-title {
        font-size: 48px; /* Smaller font size for mobile */
        top: 15px; /* Adjust vertical position */
      }

      .container {
        height: auto; /* Allow height to adjust */
        padding-top: 100px; /* Push content down to avoid title overlap */
        padding-bottom: 50px;
      }

      .cover {
        width: 200px; /* Smaller cover image for mobile */
      }

      .overlay {
        flex-direction: column; /* Stack image and content vertically */
      }

      .overlay .left, .overlay .right {
        width: 100%; /* Take full width */
        height: 50%; /* Take half height */
      }

      .overlay .left {
        padding-top: 50px; /* Add some space from the top for the close button */
        padding-bottom: 20px; /* Add some space before the content below */
      }

      .overlay .left img {
        width: auto; /* Allow image to scale within half height */
        max-width: 90%; /* Constrain image width */
        max-height: 100%; /* Constrain image height within its half */
        object-fit: contain; /* Ensure the whole image is visible */
      }

      .overlay .right {
        padding-left: 20px; /* Adjust padding for mobile */
        padding-right: 20px; /* Adjust padding for mobile */
        align-items: center; /* Center align items for mobile */
        text-align: center; /* Center align text */
        gap: 5vh; /* Reduce gap for mobile */
        justify-content: flex-start; /* Align content to the top of its half */
      }

      .text-block {
        align-items: center; /* Center align text blocks */
      }

      .close-btn {
        top: 15px; /* Adjust position for mobile */
        right: 15px; /* Adjust position for mobile */
      }

      .top-left {
        top: 15px; /* Adjust position for mobile */
        left: 15px; /* Adjust position for mobile */
      }
    }
  </style>
</head>
<body>
  <div class="main-title">BAKSEY</div>
  <div class="top-left" onclick="openOverlay('socials')">SOCIALS</div>
  <div class="container">
    <img src="Cover.jpeg" class="cover" onclick="openOverlay('track')" />
  </div>

  <div id="overlay" class="overlay" onclick="onOverlayClick(event)">
    <div class="close-btn" onclick="closeOverlay()">×</div>
    <div class="left"><img id="overlayImage" src="" /></div>
    <div class="right" id="overlayContent"></div>
  </div>

  <script>
    const overlay = document.getElementById("overlay");
    const overlayImage = document.getElementById("overlayImage");
    const overlayContent = document.getElementById("overlayContent");
    const leftPane = document.querySelector(".overlay .left");
    const rightPane = document.querySelector(".overlay .right");
    let currentOverlayKey = null;

    const data = {
      track: {
        image: "Cover.jpeg",
        html: `<div class="text-block"><div>As Long As We're Free</div></div>
               <div class="text-block">
                 <a href="https://open.spotify.com/track/6w50Qn2sMPc8iG3DRQXT0w?si=c4046090f0644b97" target="_blank">Spotify ↗</a>
                 <a href="https://music.apple.com/us/album/as-long-as-were-free/1823328526?i=1823328917&app=itunes" target="_blank">Apple Music ↗</a>
                 <a href="https://listen.tidal.com/track/446046198" target="_blank">Tidal ↗</a>
                 <a href="https://music.youtube.com/watch?v=rB9qUD_zDbc" target="_blank">YouTube Music ↗</a>
                 <a href="https://www.deezer.com/track/3444399121" target="_blank">Deezer ↗</a>
                 <a href="https://music.amazon.com/albums/B0FGPCHSN6?trackAsin=B0FGQ55DQL" target="_blank">Amazon Music ↗</a>
               </div>`
      },
      socials: {
        image: "Photo.jpeg",
        html: `<div class="text-block"><div>Baksey</div></div>
               <div class="text-block">
                 <a href="https://open.spotify.com/artist/2krKb89WmzJSdMsuiL7hkd?si=ihinZBm3SjyNegRZJoOdQw" target="_blank">Spotify ↗</a>
                 <a href="https://music.apple.com/ru/artist/baksey/1823328682" target="_blank">Apple Music ↗</a>
                 <a href="https://www.youtube.com/@iambaksey" target="_blank">YouTube ↗</a>
                 <a href="https://www.instagram.com/iambaksey" target="_blank">Instagram ↗</a>
                 <a href="https://www.tiktok.com/@bakseymusic" target="_blank">TikTok ↗</a>
               </div>`
      }
    };

    function openOverlay(key) {
      if (overlay.classList.contains("active") && currentOverlayKey !== key) {
          leftPane.classList.add('fading');
          rightPane.classList.add('fading');

          rightPane.addEventListener('transitionend', function handler(e) {
              if (e.propertyName !== 'opacity') return;
              
              updateOverlayContent(key);
              
              leftPane.classList.remove('fading');
              rightPane.classList.remove('fading');
              
              rightPane.removeEventListener('transitionend', handler);
          });
          
      } else if (!overlay.classList.contains("active")) {
          updateOverlayContent(key);
          overlay.classList.add("active");
      }
    }
    
    function updateOverlayContent(key) {
        currentOverlayKey = key;
        overlayImage.src = data[key].image;
        overlayContent.innerHTML = data[key].html;
    }

    function closeOverlay() {
      overlay.classList.remove("active");
      currentOverlayKey = null;
    }

    function onOverlayClick(e) {
      if (e.target === overlay) closeOverlay();
    }
  </script>
</body>
</html>
